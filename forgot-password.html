<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - KKR AI</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card glass-panel">
            <div class="auth-header">
                <a href="index.html" class="kkr-brand">
                    <div class="kkr-logo-icon">
                        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    </div>
                    <span class="kkr-logo-text">KKR AI</span>
                </a>
                <p style="color:var(--text-muted); margin-top:8px;">Reset Password</p>
            </div>
            <form id="reset-form" class="auth-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required placeholder="name@domain.com">
                </div>
                <button type="submit" class="btn-primary" style="width:100%;">Send Reset Link</button>
            </form>
        </div>
    </div>
    <script type="module">
        import { resetPassword } from './firebase/auth.js';
        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await resetPassword(document.getElementById('email').value);
                alert("Password reset email sent!");
                window.location.href = 'login.html';
            } catch (err) { alert(err.message); }
        });
    </script>
</body>
</html>
