<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKR AI - Studio Workspace</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/sidebar.css">
    <link rel="stylesheet" href="assets/css/chat.css">
    <link rel="stylesheet" href="assets/css/animations.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <style>
        .error-bubble {
            background: rgba(239, 68, 68, 0.15) !important;
            border: 1px solid rgba(239, 68, 68, 0.4) !important;
            color: #fca5a5 !important;
        }
    </style>
</head>
<body>
    <aside class="sidebar glass-panel">
        <div class="sidebar-header">
            <a href="index.html" class="kkr-brand">
                <div class="kkr-logo-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                </div>
                <span class="kkr-logo-text">KKR AI</span>
            </a>
        </div>
        <button id="btn-new-chat" class="btn-new-chat">+ New Conversation</button>
        <div id="chat-history-list" class="chat-history-list"></div>
        <div style="margin-top:auto; padding-top:15px; border-top:1px solid var(--border-color); display:flex; gap:10px;">
            <a href="profile.html" style="color:var(--text-main); text-decoration:none; font-size:0.9rem;">Profile</a> | 
            <a href="settings.html" style="color:var(--text-main); text-decoration:none; font-size:0.9rem;">Settings</a>
        </div>
    </aside>

    <main class="chat-workspace">
        <header class="chat-header glass-panel">
            <div style="display:flex; align-items:center; gap:15px;">
                <select id="model-select" class="model-selector">
                    <option value="gpt-4o-mini">KKR Fast (GPT-4o-Mini)</option>
                    <option value="gpt-4">KKR Reasoning Pro (GPT-4o)</option>
                </select>
                <label style="display:flex; align-items:center; gap:6px; font-size:0.85rem; cursor:pointer;">
                    <input type="checkbox" id="thinking-mode-toggle"> Thinking Mode
                </label>
            </div>
        </header>

        <section id="messages-container" class="messages-container"></section>

        <footer class="input-container-wrapper">
            <div class="chat-input-box">
                <textarea id="prompt-input" rows="1" placeholder="Message KKR AI..."></textarea>
                <div class="input-actions">
                    <button id="send-btn" class="btn-primary" style="padding:8px 18px;">Send</button>
                </div>
            </div>
        </footer>
    </main>

    <script type="module">
        import { listenAuthState } from './firebase/auth.js';
        import { createChatSession, getUserChats } from './firebase/firestore.js';

        const API_KEY = "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";
        
        let conversationHistory = [];
        let currentUser = null;

        listenAuthState((user) => {
            currentUser = user;
        });

        const appendMessage = (role, text, isError = false) => {
            const container = document.getElementById('messages-container');
            const row = document.createElement('div');
            row.className = `message-row ${role}`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.innerText = role === 'user' ? 'U' : 'K';

            const bubble = document.createElement('div');
            bubble.className = `message-bubble ${isError ? 'error-bubble' : ''}`;
            bubble.innerText = text;

            row.appendChild(avatar);
            row.appendChild(bubble);
            container.appendChild(row);
            container.scrollTop = container.scrollHeight;

            return bubble;
        };

        const handleSend = async () => {
            const input = document.getElementById('prompt-input');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            appendMessage('user', text);
            conversationHistory.push({ role: 'user', content: text });

            const assistantBubble = appendMessage('assistant', 'KKR AI is thinking...');

            try {
                // Try Direct Connection first to guarantee immediate response
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'gpt-4o-mini',
                        messages: [
                            { role: 'system', content: 'You are KKR AI, a modern ultra-premium AI assistant.' },
                            ...conversationHistory
                        ],
                        stream: true
                    })
                });

                if (!response.ok) {
                    const errData = await response.text();
                    assistantBubble.classList.add('error-bubble');
                    assistantBubble.innerText = `API Error (${response.status}): ${errData}`;
                    return;
                }

                assistantBubble.innerText = '';
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const dataStr = line.replace('data: ', '').trim();
                            if (dataStr === '[DONE]') break;
                            try {
                                const parsed = JSON.parse(dataStr);
                                const content = parsed.choices?.[0]?.delta?.content || '';
                                fullText += content;
                                assistantBubble.innerText = fullText;
                            } catch (e) {}
                        }
                    }
                }

                conversationHistory.push({ role: 'assistant', content: fullText });

            } catch (err) {
                console.error("Fetch Exception:", err);
                assistantBubble.classList.add('error-bubble');
                assistantBubble.innerText = `Connection Failed: ${err.message}. Please make sure you are running via HTTP server (e.g. Live Server).`;
            }
        };

        document.getElementById('send-btn').addEventListener('click', handleSend);
        document.getElementById('prompt-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });

        document.getElementById('btn-new-chat').addEventListener('click', () => {
            conversationHistory = [];
            document.getElementById('messages-container').innerHTML = '';
        });
    </script>
</body>
</html>
