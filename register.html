<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - KKR AI</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card glass-panel">
            <div class="auth-header">
                <a href="index.html" class="kkr-brand">
                    <div class="kkr-logo-icon">
                        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    </div>
                    <span class="kkr-logo-text">KKR AI</span>
                </a>
                <p style="color:var(--text-muted); margin-top:8px;">Create your account</p>
            </div>
            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required placeholder="name@domain.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary" style="width:100%;">Create Account</button>
            </form>
            <p style="text-align:center; margin-top:20px; font-size:0.85rem; color:var(--text-muted);">
                Already have an account? <a href="login.html" style="color:var(--accent-cyan);">Sign In</a>
            </p>
        </div>
    </div>
    <script type="module">
        import { registerEmail } from './firebase/auth.js';
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await registerEmail(document.getElementById('email').value, document.getElementById('password').value);
                window.location.href = 'chat.html';
            } catch (err) { alert(err.message); }
        });
    </script>
</body>
</html>
